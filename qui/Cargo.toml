[package]
name = "qui"
version = "0.0.1"
edition = "2024"
description = "Interactive TUI for quod"
publish = false

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-server = "0.7"
lsp-types = "0.97"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-highlight = "0.25"
tree-sitter-quodscript = { path = "../tree-sitter-quodscript" }

[profile.release]
lto = "thin"
strip = true
